<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <title>Login | AccessAudit Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: 1fr 1.2fr; max-width: 1000px; width: 100%; box-shadow: var(--shadow-lg); }
        @media (max-width: 768px) { .login-box { grid-template-columns: 1fr; } .login-visual { display: none; } }
    </style>
</head>
<body>
    <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100;">
        <button class="theme-toggle" title="Toggle Theme" style="background: white; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">🌙</button>
        <button class="rtl-toggle" title="Toggle RTL" style="background: white; border: 1px solid #e2e8f0; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;"><i class="fas fa-right-left"></i></button>
    </div>
    <div class="login-container">
        <div class="login-box" style="grid-template-columns: 1fr; max-width: 500px;">
            <div style="padding: 50px;">
                <!-- Branding & Welcome Text moved here -->
                <div style="text-align: center; margin-bottom: 40px;">
                    <a href="index.html" class="logo" style="color: var(--primary); justify-content: center; margin-bottom: 25px;"><i class="fas fa-universal-access"></i><span>AccessAudit</span></a>
                    <h2 style="font-size: 1.8rem; margin-bottom: 15px;">Welcome Back.</h2>
                    <p style="color: var(--text-muted); font-size: 15px;">Sign in to access your accessibility audit dashboard and compliance reports.</p>
                </div>

                <div style="margin-bottom: 30px; text-align: center;">
                    <h3 style="margin-bottom: 8px;">Sign In</h3>
                </div>
                
                <form action="dashboard.html" method="GET" style="display: grid; gap: 20px;">
                    <div>
                        <label for="email" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Email Address</label>
                        <input type="email" id="email" placeholder="name@company.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                    </div>
                    <div>
                        <label for="password" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                            <button type="button" class="password-toggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer;"><i class="fas fa-eye"></i></button>
                        </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="remember" style="width: 16px; height: 16px; cursor: pointer;">
                            <label for="remember" style="font-size: 14px; color: var(--text-muted); cursor: pointer;">Remember me for 30 days</label>
                        </div>
                        <a href="#" style="font-size: 13px; color: var(--primary); font-weight: 500;">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 15px; width: 100%; margin-top: 15px;">Sign In to Dashboard</button>
                    
                    <!-- Section 3: Social Login -->
                    <div style="text-align: center; position: relative; margin: 20px 0;">
                        <span style="background: white; padding: 0 15px; position: relative; z-index: 2; font-size: 14px; color: var(--text-muted);">Or continue with</span>
                        <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #e2e8f0;"></div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button type="button" class="btn btn-outline" style="font-size: 14px;"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn btn-outline" style="font-size: 14px;"><i class="fab fa-apple"></i> Apple</button>
                    </div>

                    <div style="text-align: center; margin-top: 25px;">
                        <p style="color: var(--text-muted); font-size: 14px;">New here? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create an account</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/accessibility.js"></script>
</body>
</html>
