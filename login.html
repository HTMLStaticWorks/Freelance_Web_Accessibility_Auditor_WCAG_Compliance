<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AccessAudit Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: white; border-radius: 20px; overflow: hidden; display: grid; grid-template-columns: 1fr 1.2fr; max-width: 1000px; width: 100%; box-shadow: var(--shadow-lg); }
        @media (max-width: 768px) { .login-box { grid-template-columns: 1fr; } .login-visual { display: none; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Section 1: Split Layout (Left) -->
            <div class="login-visual" style="background: linear-gradient(135deg, var(--primary), var(--accent)); padding: 60px; color: white; display: flex; flex-direction: column; justify-content: center; position: relative;">
                <a href="index.html" class="logo" style="color: white; margin-bottom: 40px;"><i class="fas fa-universal-access"></i><span>AccessAudit</span></a>
                <h2 style="color: white; font-size: 2rem; margin-bottom: 20px;">Welcome Back.</h2>
                <p style="opacity: 0.9;">Sign in to access your accessibility audit dashboard and compliance reports.</p>
                <div style="margin-top: auto;">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <i class="fas fa-check-circle" style="color: var(--success);"></i> <span>Real-time Compliance Tracking</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <i class="fas fa-check-circle" style="color: var(--success);"></i> <span>Exportable VPAT Reports</span>
                    </div>
                </div>
            </div>
            
            <!-- Section 2: Login Form (Right) -->
            <div style="padding: 60px;">
                <div style="margin-bottom: 40px;">
                    <h2 style="margin-bottom: 10px;">Sign In</h2>
                    <p style="color: var(--text-muted);">New here? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create an account</a></p>
                </div>
                
                <form action="dashboard.html" method="GET" style="display: grid; gap: 20px;">
                    <div>
                        <label for="email" style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Email Address</label>
                        <input type="email" id="email" placeholder="name@company.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <label for="password" style="font-weight: 600; font-size: 14px;">Password</label>
                            <a href="#" style="font-size: 12px; color: var(--primary);">Forgot Password?</a>
                        </div>
                        <div style="position: relative;">
                            <input type="password" id="password" placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;" required>
                            <button type="button" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; color: #94a3b8;"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="font-size: 14px;">Remember me for 30 days</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding: 15px;">Sign In to Dashboard</button>
                    
                    <!-- Section 3: Social Login -->
                    <div style="text-align: center; position: relative; margin: 20px 0;">
                        <span style="background: white; padding: 0 15px; position: relative; z-index: 2; font-size: 14px; color: var(--text-muted);">Or continue with</span>
                        <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #e2e8f0;"></div>
                    </div>
                    
                    <div class="grid grid-2" style="gap: 10px;">
                        <button type="button" class="btn btn-outline" style="font-size: 14px;"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="btn btn-outline" style="font-size: 14px;"><i class="fab fa-apple"></i> Apple</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/accessibility.js"></script>
</body>
</html>
